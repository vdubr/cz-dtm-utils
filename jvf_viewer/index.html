<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>JVF DTM Prohlížeč — vizualizace a validace JVF souborů Digitální technické mapy ČR</title>
  <meta name="description" content="Webový prohlížeč souborů JVF DTM (Jednotný výměnný formát Digitální technické mapy ČR). 2D mapa, 3D pohled s terénem ČÚZK DMR5G, topologická validace. Soubory se zpracovávají lokálně v prohlížeči — nic se neodesílá na server." />
  <meta name="keywords" content="JVF, DTM, Digitální technická mapa, ČR, ČÚZK, DMVS, prohlížeč, viewer, validace, S-JTSK, GIS, IS DMVS" />
  <meta name="author" content="Vojtěch Dubrovský" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://cz-dtm-utils.vercel.app/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cz-dtm-utils.vercel.app/" />
  <meta property="og:title" content="JVF DTM Prohlížeč" />
  <meta property="og:description" content="Vizualizace a validace souborů JVF DTM (Digitální technická mapa ČR) přímo v prohlížeči. 2D + 3D, topologická validace, podklady ČÚZK." />
  <meta property="og:locale" content="cs_CZ" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="JVF DTM Prohlížeč" />
  <meta name="twitter:description" content="Vizualizace a validace souborů JVF DTM (Digitální technická mapa ČR) přímo v prohlížeči." />

  <!-- Theme color (mobile browser chrome) -->
  <meta name="theme-color" content="#ededf4" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Fonts & styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0" />
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/app-m3.css" />
  <link rel="stylesheet" href="/src/app-themes.css" />

  <!-- Structured data (JSON-LD) — pomáhá Googlu pochopit, co aplikace dělá -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "JVF DTM Prohlížeč",
      "description": "Webový prohlížeč souborů JVF DTM (Jednotný výměnný formát Digitální technické mapy ČR) s 2D mapou, 3D pohledem a topologickou validací.",
      "url": "https://cz-dtm-utils.vercel.app/",
      "applicationCategory": "GIS",
      "operatingSystem": "Web (any)",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "inLanguage": "cs",
      "author": {
        "@type": "Person",
        "name": "Vojtěch Dubrovský",
        "url": "https://www.linkedin.com/in/vojtechdubrovsky/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header id="app-header">
      <div class="header-left">
        <button id="btn-drawer" class="m3-icon-btn drawer-toggle" type="button" aria-label="Otevřít panel vrstev" aria-controls="layer-panel" aria-expanded="false" title="Panel vrstev">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <button id="btn-app-launcher" class="m3-icon-btn app-launcher-btn" type="button" aria-label="Nástroje DTM (JVF, UDM, JŽM)" aria-haspopup="dialog" aria-controls="app-launcher" aria-expanded="false" title="Nástroje DTM — JVF, UDM, JŽM">
          <span class="material-symbols-outlined">apps</span>
        </button>
        <span id="app-badge" class="app-badge app-logo" data-app-badge data-app-id="jvf" aria-hidden="true">JVF</span>
        <div class="app-title">
          <h1 id="app-title" data-app-name>JVF Prohlížeč</h1>
          <span class="app-family">DTM Prohlížeč</span>
        </div>
      </div>
      <div class="header-right">
        <div class="upload-wrapper">
          <button id="btn-upload" class="btn btn-primary" title="Vybrat a načíst JVF DTM soubor (XML)">
            <span class="material-symbols-outlined">upload</span><span class="btn-label">Nahrát soubor</span>
          </button>
          <button id="btn-upload-menu" class="btn btn-primary btn-upload-menu" title="Načíst ukázkový soubor" aria-label="Ukázkové soubory" aria-haspopup="true" aria-expanded="false">
            <span class="material-symbols-outlined">expand_more</span>
          </button>
          <div id="upload-menu" class="upload-menu" hidden role="menu">
            <div class="upload-menu-title">Ukázkové soubory</div>
            <button class="upload-menu-item" data-mode="jvf" data-sample="ukazka_ZPS.xml" role="menuitem" title="Základní prostorová situace">ukazka_ZPS.xml</button>
            <button class="upload-menu-item" data-mode="jvf" data-sample="ukazka_DI.xml" role="menuitem" title="Dopravní infrastruktura">ukazka_DI.xml</button>
            <button class="upload-menu-item" data-mode="jvf" data-sample="ukazka_KI.xml" role="menuitem" title="Komunikační infrastruktura">ukazka_KI.xml</button>
            <button class="upload-menu-item" data-mode="jvf" data-sample="ukazka_OPL.xml" role="menuitem" title="Ochranná pásma a linie">ukazka_OPL.xml</button>
            <button class="upload-menu-item" data-mode="udm" data-sample="UDM_ukazka-1.xml" role="menuitem" title="Univerzální datový model ČKZ 2.1.1 — ukázka reálných dat (ČKZ)">UDM_ukazka-1.xml</button>
            <button class="upload-menu-item" data-mode="udm" data-sample="udm_minimal.xml" role="menuitem" title="Univerzální datový model ČKZ 2.1.1 — minimální testovací soubor">udm_minimal.xml</button>
            <button class="upload-menu-item" data-mode="udm" data-sample="udm_pontonovy_most.xml" role="menuitem" title="Univerzální datový model ČKZ 2.1.1 — pontonový most (obvod mostu + komunikace s dřevěným povrchem)">udm_pontonovy_most.xml</button>
            <button class="upload-menu-item" data-mode="jzm" data-sample="zxml_nadrazi.xml" role="menuitem" title="ŽXML 1.5.1.6 — schematické nádraží v místě stanice Řevnice (koleje, nástupiště, výhybky, návěstidla, balízy, přejezd, staničení; smyšlená data)">zxml_nadrazi.xml</button>
            <button class="upload-menu-item" data-mode="jzm" data-sample="zxml_minimal.xml" role="menuitem" title="ŽXML 1.5.1.6 — minimální změnové věty (Ins / Upd / Del, staničení)">zxml_minimal.xml</button>
            <button class="upload-menu-item" data-mode="jzm" data-sample="zxml-prvky-sz.xml" role="menuitem" title="ŽXML 1.4.2.1 — oficiální ukázka Správy železnic (kolejnicový mazník, přejezd)">zxml-prvky-sz.xml</button>
          </div>
        </div>
        <input type="file" id="file-input" accept=".xml,.jvf" multiple style="display:none" />
        <button id="btn-validate" class="btn btn-secondary" disabled title="Nejprve nahrajte JVF soubor">
          <span class="material-symbols-outlined">rule</span><span class="btn-label">Zkontrolovat</span>
        </button>
        <button id="btn-features" class="btn btn-secondary" disabled title="Nejprve nahrajte JVF soubor">
          <span class="material-symbols-outlined">list</span><span class="btn-label">Přehled prvků</span>
        </button>
        <button id="btn-export-cad" class="btn btn-outlined" data-mode="jvf udm jzm" disabled title="Nejprve nahrajte JVF soubor">
          <span class="material-symbols-outlined">download</span><span class="btn-label">Export do CAD</span>
        </button>
        <button id="btn-3d" class="btn btn-icon-round" title="Přepnout mezi 2D mapou a 3D pohledem">3D</button>
        <button id="btn-theme" class="btn btn-icon-round btn-theme" data-theme="light" title="Přepnout na tmavý motiv (aplikace, 2D mapa i 3D scéna)" aria-label="Přepnout na tmavý motiv"><span class="material-symbols-outlined">dark_mode</span></button>
      </div>
    </header>
    <!-- Spouštěč nástrojů (ui/appModeSwitch.ts) — mimo hlavičku, aby překryl i panel vrstev na mobilu. -->
    <div id="app-launcher" class="app-launcher" role="dialog" aria-label="Nástroje DTM" hidden></div>
    <div id="app-body">
      <aside id="layer-panel">
        <button id="btn-app-launcher-drawer" class="drawer-app-btn" type="button" aria-haspopup="dialog" aria-controls="app-launcher" aria-expanded="false" title="Přepnout nástroj (JVF, UDM, JŽM)">
          <span class="app-badge" data-app-badge data-app-id="jvf" aria-hidden="true">JVF</span>
          <span class="drawer-app-name" data-app-name>JVF Prohlížeč</span>
          <span class="material-symbols-outlined" aria-hidden="true">apps</span>
        </button>
        <div class="panel-section" id="projects-section" style="display:none">
          <button type="button" class="panel-section-title projects-header" id="projects-header" aria-expanded="true" title="Sbalit / rozbalit seznam projektů">
            <span class="material-symbols-outlined projects-chevron">expand_more</span>
            <span class="projects-header-label">Projekty</span>
            <span class="projects-header-count" id="projects-header-count"></span>
          </button>
          <div id="projects-list" class="projects-list"></div>
        </div>
        <div class="panel-section panel-section-jvf">
          <div class="panel-section-title-row">
            <div class="panel-section-title">JVF vrstvy</div>
            <button id="btn-legend" class="section-icon-btn" title="Zobrazit legendu všech typů DTM">
              <span class="material-symbols-outlined">legend_toggle</span>
            </button>
            <button id="btn-symbol-legend" class="section-icon-btn" data-mode="udm jzm" title="Legenda znaků dialektu (symboly) — náhled a stažení SVG v balíku ZIP">
              <span class="material-symbols-outlined">category</span>
            </button>
          </div>
          <!-- Bez dat vodotisk uprostřed panelu (kreslí i ui/layerPanel.ts). -->
          <div id="jvf-layers-list" class="jvf-layers-list">
            <div class="empty-hint panel-empty-hint">
              <button type="button" class="panel-empty-upload" data-upload-trigger title="Nahrát soubor z disku" aria-label="Nahrát soubor z disku">
                <span class="material-symbols-outlined" aria-hidden="true">upload_file</span>
              </button>
              <span>Přetáhněte data ve formátu <span data-app-format>JVF</span></span>
            </div>
          </div>
          <div id="changeset-options-section" class="three-options-footer" style="display:none">
            <label class="toggle-row" id="row-highlight-zapis" title="Přebarvit nové / editované / mazané záznamy barvou typu změny. Vypnuto = záznamy se kreslí vlastní symbologií (u souborů UDM a ŽXML výchozí).">
              <input type="checkbox" class="m3-switch" id="toggle-highlight-zapis" />
              <span>Zvýraznit změny barvou</span>
            </label>
            <label class="toggle-row" id="row-show-inserted" style="display:none" title="Zobrazit objekty se ZapisObjektu='i' (nové záznamy, teprve se budou do DTM vkládat) zeleně">
              <input type="checkbox" class="m3-switch" id="toggle-show-inserted" />
              <span>Zobrazit nové (zeleně)</span>
            </label>
            <label class="toggle-row" id="row-show-updated" style="display:none" title="Zobrazit objekty se ZapisObjektu='u' (editované záznamy) oranžově">
              <input type="checkbox" class="m3-switch" id="toggle-show-updated" />
              <span>Zobrazit editované (oranžově)</span>
            </label>
            <label class="toggle-row" id="row-show-deleted" style="display:none" title="Zobrazit objekty se ZapisObjektu='d' (změnové věty — záznamy ke smazání) sytě červeně">
              <input type="checkbox" class="m3-switch" id="toggle-show-deleted" />
              <span>Zobrazit mazané (červeně)</span>
            </label>
          </div>
          <div id="three-options-section" class="three-options-footer" style="display:none">
            <label class="toggle-row" title="Renderovat bodové objekty jako SVG ikony (stejné jako 2D) místo jednoduchých puntíků">
              <input type="checkbox" class="m3-switch" id="toggle-svg-symbols" />
              <span>SVG symboly pro body</span>
            </label>
            <label class="toggle-row" title="Zobrazit terén z ČÚZK DMR5G (±300 m kolem dat), hypsometricky obarvený">
              <input type="checkbox" class="m3-switch" id="toggle-terrain" />
              <span>Terén (ČÚZK DMR5G)</span>
              <span id="terrain-spinner" class="terrain-spinner" hidden></span>
            </label>
          </div>
        </div>
        <footer class="panel-footer">
          <div class="footer-text">
            Made by
            <a href="https://www.linkedin.com/in/vojtechdubrovsky/" target="_blank" rel="noopener noreferrer" class="linkedin-link" title="Vojtěch Dubrovský — LinkedIn">
              <svg class="linkedin-icon" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/>
              </svg>Vojtech Dubrovsky</a>
            for <span class="heart">&#10084;<span class="heart-tooltip">My wife</span></span>
            <span class="build-info" id="build-info"></span>
          </div>
        </footer>
      </aside>
      <div id="drawer-scrim" class="drawer-scrim" hidden></div>
      <main id="map-area">
        <div id="map-container"></div>
        <!-- Podkladová mapa nad mapou (jako mapy.cz) — map/cuzk.ts: „Podkladová mapa"
             otevře kartu se seznamem náhledů, „Letecká" rychle přepne na ortofoto a zpět. -->
        <!-- Plovoucí ovládání nad mapou vlevo nahoře (ui/mapCard.ts). -->
        <div class="map-top-controls">
        <div id="basemap-control" class="map-control">
          <div class="basemap-bar" role="group" aria-label="Podkladová mapa">
            <button id="btn-basemap-menu" class="basemap-bar-btn basemap-bar-menu" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="basemap-card" title="Vybrat podkladovou mapu a její sytost">
              <span class="material-symbols-outlined" aria-hidden="true">layers</span><span>Podkladová mapa</span>
              <span id="basemap-spinner" class="terrain-spinner" hidden></span>
            </button>
            <button id="btn-basemap-quick" class="basemap-bar-btn" type="button" title="Přepnout na leteckou mapu (ortofoto)">
              <span class="material-symbols-outlined" aria-hidden="true" data-quick-icon>flight</span><span data-quick-label>Letecká</span>
            </button>
          </div>
          <div id="basemap-card" class="basemap-card" role="dialog" aria-label="Podkladová mapa" hidden>
            <div id="base-layer-btns" class="basemap-list" role="radiogroup" aria-label="Podkladová mapa">
              <div class="basemap-item active" data-layer="zm">
                <button class="base-btn active" type="button" data-layer="zm" role="radio" aria-checked="true" title="Podklad ČÚZK — Základní mapa ČR">
                  <img class="basemap-thumb" src="/podklady/zakladni.jpg" alt="" width="88" height="56" loading="lazy" />
                  <span class="basemap-label">Základní mapa</span>
                </button>
                <div class="basemap-opacity-row" id="basemap-opacity-row">
                  <input type="range" class="m3-slider" id="basemap-opacity" min="0" max="100" value="100" aria-label="Sytost podkladové mapy" title="Sytost podkladové mapy (2D i 3D textura na terénu) — nižší hodnota nechá lépe vyniknout vykreslené prvky" />
                </div>
              </div>
              <div class="basemap-item" data-layer="ortofoto">
                <button class="base-btn" type="button" data-layer="ortofoto" role="radio" aria-checked="false" title="Podklad ČÚZK — Ortofoto ČR (letecké snímky)">
                  <img class="basemap-thumb" src="/podklady/letecka.jpg" alt="" width="88" height="56" loading="lazy" />
                  <span class="basemap-label">Letecká</span>
                </button>
              </div>
              <div class="basemap-item" data-layer="none">
                <button class="base-btn" type="button" data-layer="none" role="radio" aria-checked="false" title="Bez podkladu — bílé pozadí, v tmavém motivu černé">
                  <span class="basemap-thumb basemap-thumb-blank" aria-hidden="true"></span>
                  <span class="basemap-label">Prázdná</span>
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- Překryvy DTM ČR a Katastr nemovitostí — jedna skupina tlačítek, každé
             otevře svou kartu (obsah kreslí ui/overlayPanel.ts). -->
        <div id="overlay-control" class="map-control">
          <div class="basemap-bar" role="group" aria-label="Překryvné vrstvy">
            <button id="btn-dtm-menu" class="basemap-bar-btn map-toggle-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="dtm-card" title="DTM ČR — překryv Digitální technické mapy ČR (ČÚZK), výběr vrstev a sytost">
              <span class="material-symbols-outlined" aria-hidden="true">polyline</span><span>DTM</span>
            </button>
            <button id="btn-kn-menu" class="basemap-bar-btn map-toggle-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="kn-card" title="Katastr nemovitostí — překryv ČÚZK, výběr vrstev a sytost">
              <span class="material-symbols-outlined" aria-hidden="true">grid_on</span><span>Katastr</span>
            </button>
          </div>
          <div id="dtm-card" class="basemap-card" role="dialog" aria-label="DTM ČR" hidden>
            <div class="overlay-section" id="overlay-dtm"></div>
          </div>
          <div id="kn-card" class="basemap-card" role="dialog" aria-label="Katastr nemovitostí" hidden>
            <div class="overlay-section" id="overlay-kn"></div>
          </div>
        </div>
        </div>
        <canvas id="three-canvas" style="display:none"></canvas>
        <div id="bottom-toolbars" style="display:none">
          <button id="bottom-toolbars-toggle" class="btn btn-secondary toolbars-toggle" title="Skrýt/zobrazit ovládání"><span class="material-symbols-outlined">expand_more</span></button>
          <div id="bottom-toolbars-inner" class="toolbars-inner">
          <div id="nav3d-toolbar" class="toolbar-panel">
            <span class="toolbar-label">Procházení:</span>
            <div class="nav3d-pad">
              <button class="btn btn-secondary btn-nav3d nav-up" data-nav="walk-forward" title="Vpřed (W / ↑)"><span class="material-symbols-outlined">arrow_upward</span></button>
              <button class="btn btn-secondary btn-nav3d nav-left" data-nav="walk-left" title="Vlevo (A / ←)"><span class="material-symbols-outlined">arrow_back</span></button>
              <button class="btn btn-secondary btn-nav3d nav-down" data-nav="walk-back" title="Vzad (S / ↓)"><span class="material-symbols-outlined">arrow_downward</span></button>
              <button class="btn btn-secondary btn-nav3d nav-right" data-nav="walk-right" title="Vpravo (D / →)"><span class="material-symbols-outlined">arrow_forward</span></button>
            </div>
            <button class="btn btn-secondary btn-nav3d" data-nav="walk-up" title="Výš (Q)"><span class="material-symbols-outlined">vertical_align_top</span></button>
            <button class="btn btn-secondary btn-nav3d" data-nav="walk-down" title="Níž (E)"><span class="material-symbols-outlined">vertical_align_bottom</span></button>
            <span class="toolbar-sep"></span>
            <button class="btn btn-secondary btn-nav3d" data-nav="zoom-in" title="Přiblížit (+)"><span class="material-symbols-outlined">zoom_in</span></button>
            <button class="btn btn-secondary btn-nav3d" data-nav="zoom-out" title="Oddálit (−)"><span class="material-symbols-outlined">zoom_out</span></button>
            <span class="toolbar-sep"></span>
            <button class="btn btn-secondary btn-nav3d" data-nav="rot-left" title="Otočit doleva"><span class="material-symbols-outlined">rotate_left</span></button>
            <button class="btn btn-secondary btn-nav3d" data-nav="rot-right" title="Otočit doprava"><span class="material-symbols-outlined">rotate_right</span></button>
            <button class="btn btn-secondary btn-nav3d" data-nav="tilt-up" title="Sklonit nahoru"><span class="material-symbols-outlined">expand_less</span></button>
            <button class="btn btn-secondary btn-nav3d" data-nav="tilt-down" title="Sklonit dolů"><span class="material-symbols-outlined">expand_more</span></button>
            <span class="toolbar-sep"></span>
            <button class="btn btn-secondary btn-nav3d" data-nav="set-pivot" title="Klikněte do scény pro nastavení středu otáčení"><span class="material-symbols-outlined">adjust</span></button>
            <button class="btn btn-secondary btn-nav3d" data-nav="reset" title="Reset pohledu (R)"><span class="material-symbols-outlined">home</span></button>
          </div>
          <div id="z-exag-toolbar" class="toolbar-panel">
            <span class="toolbar-label">Výška:</span>
            <button class="btn btn-secondary btn-z-exag active" data-exag="1" title="Reálná výška (bez převýšení)">1×</button>
            <button class="btn btn-secondary btn-z-exag" data-exag="2" title="Dvojnásobné převýšení (zvýraznění terénu)">2×</button>
            <button class="btn btn-secondary btn-z-exag" data-exag="5" title="Pětinásobné převýšení">5×</button>
            <button class="btn btn-secondary btn-z-exag" data-exag="10" title="Desetinásobné převýšení (silné zvýraznění)">10×</button>
          </div>
          </div>
        </div>
        <div id="loading-overlay" style="display:none">
          <div class="spinner"></div>
          <span>Načítám…</span>
        </div>
        <div id="drop-overlay" hidden>
          <div class="drop-overlay-box">
            <span class="material-symbols-outlined">upload_file</span>
            <span>Pusťte JVF soubor pro načtení</span>
          </div>
        </div>
      </main>
      <aside id="error-panel" style="display:none">
        <div class="panel-resize-handle" id="error-panel-resize"></div>
        <div class="panel-header error-panel-header">
          <span>Topologická validace</span>
          <button type="button" class="m3-icon-btn sheet-close-btn" data-close-for="btn-validate" aria-label="Zavřít panel validace" title="Zavřít">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="error-panel-toolbar">
          <div id="error-summary" class="error-summary"></div>
          <div class="error-filters">
            <button class="filter-btn active" data-filter="all" title="Zobrazit všechny nálezy (chyby i varování)">Vše</button>
            <button class="filter-btn" data-filter="error" title="Zobrazit pouze chyby (severity: error)">Chyby</button>
            <button class="filter-btn" data-filter="warning" title="Zobrazit pouze varování (severity: warning)">Varování</button>
          </div>
        </div>
        <div id="error-list" class="error-list"></div>
      </aside>
      <aside id="features-panel" style="display:none">
        <div class="panel-resize-handle" id="features-panel-resize"></div>
        <div class="panel-header features-panel-header">
          <span>Přehled prvků</span>
          <button type="button" class="m3-icon-btn sheet-close-btn" data-close-for="btn-features" aria-label="Zavřít přehled prvků" title="Zavřít">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="features-panel-toolbar">
          <div id="features-summary" class="features-summary"></div>
          <div class="features-filters">
            <!-- Tlačítka obsahových částí podle načtených dat (featuresPanel.ts) -->
          </div>
          <div id="features-project-filter" class="features-level-filter" style="display:none"></div>
          <div id="features-level-filter" class="features-level-filter" style="display:none"></div>
          <input id="features-search" class="features-search" type="search" placeholder="Filtrovat podle názvu nebo ID…" />
        </div>
        <div id="features-list" class="features-list"></div>
      </aside>
    </div>
  </div>
  <div id="info-modal" class="modal-overlay" style="display:none">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="info-modal-title">
      <div class="modal-header">
        <h2 id="info-modal-title">O aplikaci</h2>
        <button id="info-modal-close" class="modal-close" title="Zavřít">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body" id="info-modal-body"></div>
    </div>
  </div>
  <div id="legend-modal" class="modal-overlay" style="display:none">
    <div class="modal-dialog modal-dialog-lg" role="dialog" aria-modal="true" aria-labelledby="legend-modal-title">
      <div class="modal-header">
        <h2 id="legend-modal-title">Legenda DTM</h2>
        <input type="text" id="legend-modal-search" class="legend-search" placeholder="Hledat (název, kód, kategorie)…" />
        <button id="legend-modal-close" class="modal-close" title="Zavřít">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body" id="legend-modal-body"></div>
    </div>
  </div>
  <div id="symbol-legend-modal" class="modal-overlay" style="display:none">
    <div class="modal-dialog modal-dialog-lg" role="dialog" aria-modal="true" aria-labelledby="symbol-legend-modal-title">
      <div class="modal-header">
        <h2 id="symbol-legend-modal-title">Legenda znaků</h2>
        <input type="text" id="symbol-legend-modal-search" class="legend-search" placeholder="Hledat (objekt, hodnota, kód znaku)…" />
        <button id="symbol-legend-download" class="btn btn-secondary" title="Stáhnout zobrazené znaky jako SVG soubory v balíku ZIP (se seznamem znaky.csv)">Stáhnout SVG (ZIP)</button>
        <button id="symbol-legend-modal-close" class="modal-close" title="Zavřít">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body" id="symbol-legend-modal-body"></div>
    </div>
  </div>
  <div id="confirm-modal" class="modal-overlay" style="display:none">
    <div class="modal-dialog modal-dialog-sm" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
      <div class="modal-header">
        <h2 id="confirm-modal-title"></h2>
        <button id="confirm-modal-close" class="modal-close" title="Zavřít">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body" id="confirm-modal-body"></div>
      <div class="modal-footer" id="confirm-modal-footer"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
